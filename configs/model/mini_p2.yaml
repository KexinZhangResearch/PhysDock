# The size of PhysDock2's "mini" (Pairformer 8, atom DiTs 3 + 3, token DiT 6; no Evoformer: scripts/p2align feeds the query row only) in the current structure
# (medium.yaml). scripts/p2align trains it behind PhysDock2's data, noising, losses and loop (bridge.py). Not the released parameters.
defaults:
  - medium
  - _self_

encoder:
  inf: 1.0e8
  no_blocks_atom: 3
  no_blocks_evoformer: 0
  no_blocks_pairformer: 8
decoder:
  inf: 1.0e8
  no_blocks_atom: 3
  no_blocks_dit: 6
