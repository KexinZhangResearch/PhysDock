# The structure of the released parameters (data/params/params.pt): `model=released` for inference with them and for fine-tuning them. The current
# structure (medium.yaml and the sizes derived from it) differs in what `legacy` switches (PhysDock.models.model.PhysDock), the norm epsilon and the
# conditioning of the network on the noise level.
defaults:
  - medium
  - _self_

legacy: true
encoder:
  eps: 1.0e-8
decoder:
  eps: 1.0e-8
diffusion:
  noise_conditioning: legacy    # t_A * ln(t) / 4
