# python scripts/train/train.py [overrides], e.g.
#   python scripts/train/train.py trainer=ddp                          # all GPUs of the node
#   python scripts/train/train.py model=toy trainer.max_steps=200 data.samples_per_epoch=100     (quick test)
#   python scripts/train/train.py model=released init_from=data/params/params.pt   # fine-tune the released weights (their structure: model/released.yaml)
#   python scripts/train/train.py hydra.run.dir=logs/train/<run>   (a fixed run directory resumes from its newest checkpoint)
#   python scripts/train/train.py compile=true logger.offline=true
defaults:
  - model: medium                 # model/{toy,tiny,small,medium,full,medium_linear}.yaml (the current structure); released: the structure of the released parameters
  - model@features: features      # training featurisation
  - model@val_features: features  # validation featurisation (inference settings)
  - model@loss: loss
  - model@data: data
  - trainer: default              # trainer/{default,ddp}.yaml: trainer, optim, ema, checkpoint, logger
  - _self_

task_name: train
root_dir: ${oc.env:PHYSDOCK_ROOT}
output_dir: ${hydra:runtime.output_dir}   # logs/train/<time>: checkpoints, wandb, .hydra
ccd: ${root_dir}/data/ccd_id_meta_data.pkl.gz
seed: 42
init_from: null                   # start from these weights (params.pt, Lightning or Uni-Core checkpoint)
ckpt_path: auto                   # resume this Lightning checkpoint (weights, optimiser, EMA, step); auto: the newest complete one of
                                  # ${output_dir}/checkpoints (none: start from scratch); null: always start from scratch
compile: false                    # torch.compile the training step region by region (faster, less memory)
checkpointing:                    # activation checkpointing per stack: full (recompute in the backward), none (keep
                                  # all activations: faster, more memory), or a fraction between 0 and 1 (only that fraction
                                  # of the blocks is recomputed, spread evenly: time and memory in between); DiT also
                                  # attention (keep only the attention)
                                  # medium, bf16-mixed, compile, crop 256: all full 0.94 s / 12 GiB per step, default
                                  # 0.83 s / 15 GiB, DiT + Evoformer + AtomTransformer none 0.80 s / 30 GiB
                                  # crop 384 / 3072 atoms, Pairformer 48 + token DiT 24 blocks, triton, compile: default
                                  # 1.43 s / 32 GiB, Pairformer none 1.25 s / 97 GiB, all none 1.20 s / 125 GiB
  AtomTransformer: full
  Triangleformer: full
  Evoformer: full
  Pairformer: full
  DiT: attention
matmul_precision: auto          # float32 matmuls: auto = TF32 if the GPU supports it; highest = full float32
progress_refresh: 20            # steps between updates of the progress bar (in a log file: one line per update)

val:                              # validation: diffusion loss, then sampling + structure metrics
  num_samples: 5
  steps: 20

hydra:
  run:
    dir: ${root_dir}/logs/${task_name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${root_dir}/logs/${task_name}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
