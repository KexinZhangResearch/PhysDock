# @package _global_
# Training: Lightning Trainer, optimiser, EMA, checkpoints, wandb logging, gradient statistics.
trainer:                          # lightning.pytorch.Trainer arguments
  accelerator: gpu
  devices: 1
  strategy: auto
  num_nodes: 1
  precision: 32                   # 32 (TF32 matmuls, see matmul_precision) or bf16-mixed: bf16 encoder, the decoder,
                                  # distogram head and loss stay float32 (~20% less memory, ~3% faster)
  max_steps: 1000000
  gradient_clip_val: 10.0
  accumulate_grad_batches: 1
  log_every_n_steps: 10
  val_check_interval: 2000        # training steps between validations
  check_val_every_n_epoch: null
  limit_val_batches: 1.0
  num_sanity_val_steps: 0
  use_distributed_sampler: false  # the data module shards training (weighted) and validation over the ranks itself

optim:                            # Adam, linear warmup then stepwise exponential decay (released PhysDock schedule)
  lr: 1.8e-3
  betas: [0.9, 0.95]
  eps: 1.0e-8
  scheduler:
    warmup_steps: 1000
    start_decay_after: 1000
    decay_every: 1000
    decay_factor: 0.998

ema:                              # moving average of the weights; validation and checkpoints use it for inference
  decay: 0.999
  warm_start: true

checkpoint:                       # lightning.pytorch.callbacks.ModelCheckpoint: only the newest checkpoint is kept (the new file is written
                                  # before the previous one is deleted, so a crash while saving leaves a complete one)
  every_n_train_steps: 1000
  save_top_k: 1
  save_last: false

logger:                           # lightning.pytorch.loggers.WandbLogger; logger=null disables logging
  project: PhysDock
  name: ${task_name}
  offline: auto                   # auto: online if there is an API key (wandb login / WANDB_API_KEY), else local; true: local (wandb sync later)
  log_model: false

grad_stats: parameter             # gradient statistics every log_every_n_steps: total | module | parameter
                                  # (parameter: norm / abs_min / abs_max of every parameter, plus module and total)
