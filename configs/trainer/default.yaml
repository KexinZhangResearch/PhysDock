# @package _global_
# Training: Lightning Trainer, optimiser, EMA, checkpoints, wandb logging, gradient statistics.
trainer:                          # lightning.pytorch.Trainer arguments
  accelerator: gpu
  devices: 1
  strategy: auto
  num_nodes: 1
  precision: 32                   # 32 (TF32 matmuls, see matmul_precision) or bf16-mixed: bf16 encoder, the decoder,
                                  # distogram head and loss stay float32 (~20% less memory, ~3% faster)
  max_steps: 1000000
  gradient_clip_val: 10.0
  accumulate_grad_batches: 1
  log_every_n_steps: 10
  val_check_interval: 2000        # training steps between validations
  check_val_every_n_epoch: null
  limit_val_batches: 1.0
  num_sanity_val_steps: 0
  use_distributed_sampler: false  # the data module shards training (weighted) and validation over the ranks itself

optim:                            # fused AdamW; linear warmup, a plateau, then a stepwise exponential decay (AlphaFoldLRScheduler)
  lr: null                        # null: derived from the batch size, lr = reference_lr * (batch / reference_batch) ** 0.5 (the square-root rule for Adam),
                                  # batch = nodes * GPUs per node * accumulate_grad_batches structures per optimiser step; a number is used as given
  reference_lr: 1.8e-3            # AlphaFold 3 (supplement 3.7.1): 1.8e-3 at a batch of 256 structures (each with 48 diffusion samples)
  reference_batch: 256
  betas: [0.9, 0.95]              # AlphaFold 3
  eps: 1.0e-8                     # AlphaFold 3
  weight_decay: 0.0               # AlphaFold 3 trains with plain Adam (no weight decay is given in its supplement): AdamW with 0. If > 0 it is applied to
                                  # the weight matrices only (parameters with two or more dimensions), not to biases, norm scales and other vectors
  scheduler:
    warmup_steps: 1000
    start_decay_after: 5000
    decay_every: 5000
    decay_factor: 0.99

ema:                              # moving average of the weights, updated after every optimiser step (PhysDock2: decay 0.999, no warm start);
  decay: 0.999                    # validation and checkpoints use it for inference
  warm_start: false

checkpoint:                       # lightning.pytorch.callbacks.ModelCheckpoint: only the newest checkpoint is kept (the new file is written
                                  # before the previous one is deleted, so a crash while saving leaves a complete one)
  every_n_train_steps: 1000
  save_top_k: 1
  save_last: false

logger:                           # lightning.pytorch.loggers.WandbLogger; logger=null disables logging
  project: PhysDock
  name: ${task_name}
  offline: auto                   # auto: online if there is an API key (wandb login / WANDB_API_KEY), else local; true: local (wandb sync later)
  log_model: false

grad_stats: parameter             # gradient statistics every log_every_n_steps: total | module | parameter
                                  # (parameter: norm / abs_min / abs_max of every parameter, plus module and total)
