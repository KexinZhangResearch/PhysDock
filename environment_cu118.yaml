# PhysDock environment, CUDA 11.8 (torch 2.7.1 is the last release with CUDA 11.8 wheels).
#   conda env create -f environment_cu118.yaml
# Only the libraries imported by PhysDock/ and scripts/. conda-forge and PyPI through the Tsinghua mirrors; the CUDA
# build of torch is a direct wheel URL (an extra index would also serve numpy etc. slowly).
name: PhysDock-cu118
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - cuda-version=11.8          # CUDA build of OpenMM (sidechain relaxation)
  - openmm>=8.2
  - pdbfixer
  - openmmforcefields
  - openff-toolkit
  - mdtraj
  # scripts/prepare/homo_search (MSA search) also needs the binaries hhblits, jackhmmer, hmmsearch, kalign:
  # conda install -c bioconda hhsuite hmmer kalign2
  - pip:
      - --index-url https://pypi.tuna.tsinghua.edu.cn/simple
      # CUDA build of torch 2.7.1+cu118 straight from the PyTorch index; its dependencies (nvidia-*, triton) from the mirror
      - torch @ https://download.pytorch.org/whl/cu118/torch-2.7.1%2Bcu118-cp311-cp311-manylinux_2_28_x86_64.whl
      - numpy<2                # rdkit 2024.3.3 is built against numpy 1.x
      - scipy
      - pandas
      - rdkit==2024.3.3        # conformers / features as the released pipeline
      - biopython==1.84        # mmCIF / PDB parsing as the released pipeline
      - scikit-learn           # ranking (KMeans) in redocking / screening
      - tqdm
      - lightning>=2.5
      - torchmetrics>=1.6
      - hydra-core>=1.3.2
      - omegaconf>=2.3
      - wandb
      - posebusters
      - google-crc32c          # optional: fast checksums in scripts/download
