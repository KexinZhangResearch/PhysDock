# PhysDock environment, CUDA 12.4 (torch 2.6.0 is the last release with CUDA 12.4 wheels).
#   conda env create -f environment_cu124.yaml
# The libraries imported by PhysDock/ and scripts/ (without relaxation and MSA search). conda-forge and PyPI through
# the Tsinghua mirrors; the CUDA build of torch is a direct wheel URL (an extra index would also serve numpy etc. slowly).
name: PhysDock-cu124
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  # not included: sidechain relaxation (openmm, pdbfixer, openmmforcefields, openff-toolkit, mdtraj, posebusters;
  # PhysDock/utils/relaxation.py) and the MSA search binaries of scripts/prepare/homo_search (hhsuite, hmmer, kalign2)
  - pip:
      - --index-url https://pypi.tuna.tsinghua.edu.cn/simple
      # CUDA build of torch 2.6.0+cu124 straight from the PyTorch index; its dependencies (nvidia-*, triton) from the mirror
      - torch @ https://download.pytorch.org/whl/cu124/torch-2.6.0%2Bcu124-cp311-cp311-linux_x86_64.whl
      - numpy<2                # rdkit 2024.3.3 is built against numpy 1.x
      - scipy
      - pandas
      - rdkit==2024.3.3        # conformers / features as the released pipeline
      - biopython==1.84        # mmCIF / PDB parsing as the released pipeline
      - scikit-learn           # ranking (KMeans) in redocking / screening
      - tqdm
      - lightning>=2.5
      - torchmetrics>=1.6
      - hydra-core>=1.3.2
      - omegaconf>=2.3
      - wandb
      - google-crc32c          # optional: fast checksums in scripts/download
